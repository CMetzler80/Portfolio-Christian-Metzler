# docker-compose.yaml
version: "3.8"

services:
# container für die Todo-app
app:
    build: .                    # Dockerfile im selben Ordner verwenden
    container_name: meine_app
    restart: always
    ports:
      - "3000:3000"             # localhost:3000 öffnen
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/projekt_db
    depends_on:
      - mysql                   # Erst MySQL starten, dann die App 

# container für die MySql Datenbank  
mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projekt_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_daten:/var/lib/mysql

volumes:
  mysql_daten: