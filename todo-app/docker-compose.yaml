# docker-compose.yaml
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projekt_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_daten:/var/lib/mysql

volumes:
  mysql_daten: