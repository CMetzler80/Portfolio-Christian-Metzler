# docker-compose.yaml

services:
  app:
    build: .
    container_name: meine_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/projekt_db
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projekt_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_daten:/var/lib/mysql

volumes:
  mysql_daten: